apply plugin: 'application'
dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    runtimeOnly "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
}
application { mainClass = 'missaomarte.lwjgl3.Lwjgl3Launcher' }
tasks.named('run', JavaExec) {
    workingDir = rootProject.projectDir
    if (System.getProperty('os.name').toLowerCase().contains('mac')) jvmArgs '-XstartOnFirstThread'
    systemProperty 'file.encoding', 'UTF-8'
    ['missaomarte.semente', 'missaomarte.semaudio', 'missaomarte.servidor'].each { chave ->
        if (System.getProperty(chave) != null) systemProperty chave, System.getProperty(chave)
    }
}

sourceSets.main.resources.srcDirs += [file('../core/assets')]
