server.address=127.0.0.1
spring.datasource.url=jdbc:h2:file:${MISSAOMARTE_DADOS:./dados}/missao-marte
spring.datasource.username=sa
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
logging.level.org.springframework.web=INFO
missaomarte.jwt.segredo=${MISSAOMARTE_JWT_SEGREDO:}

spring.mvc.problemdetails.enabled=true
spring.jackson.datatype.enum.fail-on-numbers-for-enums=true
spring.jackson.datatype.datetime.write-dates-as-timestamps=false

spring.jackson.deserialization.fail-on-unknown-properties=false
